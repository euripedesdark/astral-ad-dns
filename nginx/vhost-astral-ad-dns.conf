# =============================================================================
# Astral AD & Hybrid DNS - Subdomain Virtual Host (ad.srvcloud.cloud / dns.srvcloud.cloud)
# =============================================================================

upstream astral_ad_dns {
    server 127.0.0.1:8095;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ad.srvcloud.cloud dns.srvcloud.cloud;

    ssl_certificate     /etc/nginx/tls/astral.crt;
    ssl_certificate_key /etc/nginx/tls/astral.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:astral_ad_dns_tls:10m;
    ssl_session_timeout       1d;

    client_max_body_size 64m;
    proxy_connect_timeout 30s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    include /etc/nginx/default.d/astral-ad-dns.conf;

    location / {
        return 301 /ad/;
    }
}
